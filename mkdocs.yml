site_name: Sabores da Terra
repo_url: https://github.com/guilopes15/sabores-da-terra
repo_name: guilopes15/sabores-da-terra
edit_uri: tree/main/docs

nav:
    - Início: index.md
    - Como começar?: get_started.md
    - Fluxo de utilização: flow.md
    - Autentificação e Autorização: auth.md
    - Regras de Negócio: rules.md
    - Rotas:
          - Index: routers/index.md
          - Users: routers/users.md
          - Auth: routers/auth.md
          - Products: routers/products.md
          - Orders: routers/orders.md
          - Payment: routers/payment.md
    - Relacionamento de Entidades: entities.md
    - Infra: infra.md
    - ChangeLog: changelog.md

plugins:
    - search:
          highlight: true
    - towncrier

theme:
    name: material
    features:
        - navigation.instant # Carrega páginas sem recarregar o site
        - navigation.tabs # Adiciona abas no menu
        - navigation.sections
        - navigation.top # Botão "voltar ao topo"
        - navigation.expand
        - content.code.copy
        - content.action.edit
    palette:
        - scheme: default
          primary: green
          accent: green
          toggle:
              icon: material/weather-night
              name: Mude para o modo escuro
        - scheme: slate
          primary: green
          accent: green
          toggle:
              icon: material/weather-sunny
              name: Mude para o modo claro
    language: pt-BR
    favicon: assets/favicon.ico

markdown_extensions:
    - toc:
          permalink: true
    - admonition
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                #format: !!python/name:pymdownx.superfences.fence_code_format (Quando encontrar uma cerca de código com nome mermaid, use a função fence_code_format para processar o conteúdo antes de renderizar)
    - pymdownx.tabbed
    - pymdownx.highlight
    - pymdownx.details
    - pymdownx.snippets

extra_css:
    - assets/stylesheets/extra.css
